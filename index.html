<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rebirth Car Coating Center — Reception</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;min-height:100vh;padding:12px}
.app{background:#fff;border:0.5px solid #e2e8f0;border-radius:12px;overflow:hidden;width:100%;max-width:720px;margin:0 auto;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.body{min-height:540px}
.card{background:#f8fafc;border:0.5px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:#475569}
.req{color:#C41010;margin-left:2px}
.inp{border:0.5px solid #cbd5e1;border-radius:8px;padding:12px 14px;font-size:15px;font-family:inherit;background:#fff;color:#111;width:100%;min-height:50px}
.inp:focus{outline:none;border-color:#C41010;box-shadow:0 0 0 3px rgba(196,16,16,.1)}
.card-num-input{border:2.5px solid #d97706;border-radius:8px;padding:14px;font-size:20px;font-weight:700;letter-spacing:2px;background:#fff!important;color:#111!important;-webkit-text-fill-color:#111!important;width:100%;min-height:56px;text-align:center;font-family:inherit;margin-bottom:14px}
.card-num-input::placeholder{color:#d97706;opacity:.6;font-weight:400;letter-spacing:0}
.btn-r{background:#C41010;color:#fff;border:none;border-radius:8px;padding:13px 24px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-r:hover,.btn-r:active{background:#a50e0e}
.btn-r:disabled{opacity:.5;cursor:not-allowed}
.btn-g{background:none;border:0.5px solid #cbd5e1;border-radius:8px;padding:13px 20px;font-size:15px;cursor:pointer;color:#64748b;font-family:inherit;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-g:hover{background:#f1f5f9}
.btn-amber{background:#d97706;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-green{background:#16a34a;color:#fff;border:none;border-radius:10px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-del{background:none;border:2px solid #dc2626;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;color:#dc2626;font-family:inherit;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.btn-del-y{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-sm{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:5px;padding:10px 0;min-height:44px;font-family:inherit}
.acts{display:flex;justify-content:space-between;align-items:center}
.steps{display:flex;align-items:flex-start;margin-bottom:22px}
.sdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.sline{flex:1;height:2px;margin:0 6px;margin-top:14px}
.scol{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.slbl{font-size:10px;margin-top:4px;white-space:nowrap}
.svc-item{border:2px solid #e2e8f0;border-radius:10px;margin-bottom:9px;overflow:hidden}
.svc-item.on{border-color:#C41010}
.svc-item.on-prepaid{border-color:#d97706!important}
.svc-row{padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;background:#fff;min-height:52px;-webkit-tap-highlight-color:transparent;user-select:none}
.svc-item.on .svc-row{background:#fff5f5}
.svc-item.on-prepaid .svc-row{background:#fffbeb!important}
.svc-chk{width:24px;height:24px;border-radius:5px;border:2.5px solid #94a3b8;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.svc-item.on .svc-chk{border-color:#C41010;background:#C41010}
.svc-item.on-prepaid .svc-chk{border-color:#d97706!important;background:#d97706!important}
.svc-n{font-size:15px;color:#111}
.svc-item.on .svc-n{font-weight:600;color:#C41010}
.svc-item.on-prepaid .svc-n{font-weight:600;color:#d97706!important}
.svc-opts{padding:12px 14px 16px;background:#fff5f5;border-top:1px solid #fca5a5;display:flex;flex-wrap:wrap;gap:9px}
.card-inp-sec{border:2.5px solid #d97706;border-radius:12px;background:#fffbeb;padding:18px;margin-top:12px}
.cx-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s;}
.cx-card:hover{border-color:#C41010;background:#fef9f9;transform:translateY(-1px);box-shadow:0 2px 8px rgba(196,16,16,.1);}
.cx-card:active{transform:translateY(0);background:#fef2f2;}
.pay-sec{border:2px solid #16a34a;border-radius:12px;background:#f0fdf4;padding:18px;margin-top:14px}
.btn-payfull{padding:10px 16px;border-radius:8px;border:2px solid #e2e8f0;background:#fff;color:#64748b;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;flex:1;transition:all .15s}
.btn-payfull.active{border-color:#16a34a;background:#f0fdf4;color:#166534}
.btn-nopay{padding:8px 16px;border-radius:8px;border:2px solid #94a3b8;background:#fff;color:#64748b;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;transition:all .15s}
.btn-nopay.active{border-color:#16a34a;background:#16a34a;color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.3)}
.crow{display:flex;gap:10px;padding:8px 0;border-bottom:0.5px solid #e2e8f0}
.clbl{font-size:12px;color:#94a3b8;min-width:110px;flex-shrink:0;padding-top:1px}
.cval{font-size:14px;font-weight:500;color:#111}
.dvdr{height:0.5px;background:#e2e8f0;margin:14px 0}
.av{border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.visit-blk{padding:14px 0;border-bottom:0.5px solid #e2e8f0}
.visit-blk:last-child{border-bottom:none}
.errbox{background:#fef2f2;color:#dc2626;padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:12px}
.stag{display:inline-block;font-size:13px;padding:5px 12px;border-radius:6px;background:#f0fdf4;color:#16a34a;margin:0 5px 6px 0}
.tb{padding:14px 18px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.tb-ok{background:#f0fdf4;color:#16a34a}
.tb-err{background:#fef2f2;color:#dc2626}
.cxrow{display:flex;align-items:center;padding:14px;border:0.5px solid #e2e8f0;border-radius:10px;cursor:pointer;margin-bottom:9px;background:#fff;gap:12px;min-height:74px;-webkit-tap-highlight-color:transparent}
.cxrow:active{border-color:#C41010}
.hcard{cursor:pointer;text-align:center;padding:26px 18px;border:0.5px solid #e2e8f0;border-radius:12px;background:#fff}
.hcard:active{border-color:#C41010}
.hico{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 13px}
.bv{background:#eff6ff;color:#3b82f6;font-size:12px;padding:3px 9px;border-radius:12px;display:inline-block}
.sec{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.del-banner{background:#fef2f2;border:2px solid #fca5a5;border-radius:12px;padding:20px;margin-top:14px;text-align:center}
.card-amber{background:#fffbeb;border:2.5px solid #d97706;border-radius:12px;padding:18px;margin-bottom:14px}
@media print{button{display:none!important}body{background:#fff;padding:0}
.app{border:none;box-shadow:none;max-width:100%;margin:0}
#receipt-box{border:none!important;box-shadow:none!important;max-width:100%!important;margin:0!important;padding:10px!important}}
</style>
</head>
<body>
<div class="app">
<div style="background:#fff;border-top:5px solid #C41010">
<div style="padding:12px 22px 8px;display:flex;align-items:center;gap:14px">
<svg width="46" height="46" viewBox="0 0 46 46" fill="none">
<circle cx="23" cy="23" r="20" stroke="#111" stroke-width="2.5"/>
<circle cx="23" cy="23" r="7.5" stroke="#111" stroke-width="2"/>
<line x1="23" y1="3" x2="23" y2="15.5" stroke="#111" stroke-width="2.2"/>
<line x1="23" y1="30.5" x2="23" y2="43" stroke="#111" stroke-width="2.2"/>
<line x1="3" y1="23" x2="15.5" y2="23" stroke="#111" stroke-width="2.2"/>
<line x1="30.5" y1="23" x2="43" y2="23" stroke="#111" stroke-width="2.2"/>
<line x1="8.5" y1="8.5" x2="17" y2="17" stroke="#111" stroke-width="1.7"/>
<line x1="29" y1="29" x2="37.5" y2="37.5" stroke="#111" stroke-width="1.7"/>
<line x1="37.5" y1="8.5" x2="29" y2="17" stroke="#111" stroke-width="1.7"/>
<line x1="17" y1="29" x2="8.5" y2="37.5" stroke="#111" stroke-width="1.7"/>
<circle cx="23" cy="3" r="4.5" fill="#C41010"/>
<circle cx="23" cy="3" r="1.8" fill="white"/>
</svg>
<div>
<div style="font-style:italic;font-weight:900;font-size:30px;color:#111;letter-spacing:-1px;line-height:1;font-family:Georgia,serif">REB<span style="color:#C41010">i</span>RTH</div>
<div style="background:#C41010;color:#fff;font-size:9px;font-weight:700;letter-spacing:.25em;padding:3px 9px;display:inline-block;margin-top:4px;font-style:italic">CAR COATING CENTER</div>
</div>
</div>
<div style="height:4px;background:#C41010"></div>
</div>
<div class="body" id="body"></div>
</div>
<script>
'use strict';
let _submitting = false;
// ═══════════════════════════════════════════════════════════
//  REBIRTH CAR COATING CENTER — Reception System v2.0
// ═══════════════════════════════════════════════════════════

const R = '#C41010';
const STAFF = ['Nicole','Diane','Jho'];


const PAY_METHODS = ['Cash','Credit Card','GCash (Acct 1)','GCash (Acct 2)','Bank Transfer'];

const SVC = [
  // ── PPF ──────────────────────────────────────────────────
  {id:'ppf_motec', n:'PPF — Motec',            opts:['6.5mil','7.5mil','8.5mil','Warranty Replacement']},
  {id:'ppf_stek',  n:'PPF — STEK',             opts:['DYNO','FORCE','Warranty Replacement']},
  {id:'ppm',       n:'PPF maintenance',         opts:[]},
  {id:'ppf_ins',   n:'PPF Free Inspection',     opts:[], free:true},
  // ── Coating ──────────────────────────────────────────────
  {id:'cer',       n:'Ceramic coating',         opts:['Budget','Standard','Premium','Super Premium']},
  {id:'gra',       n:'Graphene coating',        opts:['Budget','Standard','Premium','Super Premium']},
  {id:'dia',       n:'Diamond coating',         opts:['Standard','Premium','Super Premium']},
  {id:'tit',       n:'Titanium coating',        opts:['Standard','Premium','Super Premium']},
  {id:'g15',       n:'15H Ceramic guard',       opts:['Standard','Premium','Super Premium']},
  {id:'cem',       n:'Coating maintenance',     opts:[]},
  {id:'free_mnt',  n:'Free Maintenance',        opts:['Coating','PPF'], free:true},
  // ── Other ─────────────────────────────────────────────────
  {id:'pnt',       n:'Paint & body repair',     opts:['Panel','Washover & Coating','Washover & PPF']},
  {id:'tnt',       n:'Tint',                    opts:['Action','Lunaray','Nex']},
  {id:'wnd',       n:'Windshield protection',   opts:[]},
  {id:'abc',       n:'Anti-bacterial coating',  opts:[]},
  {id:'buf',       n:'Buffing / Polishing',     opts:[]},
  {id:'dnt',       n:'Dent repair',             opts:[]},
  {id:'rct',       n:'Re-coating',              opts:[]},
  // ── Prepaid Card（一番下）─────────────────────────────────
  {id:'prepaid',   n:'Maintenance Prepaid Card',opts:[]},
];

const ms   = () => SVC.map(s => ({id:s.id, on:false, opt:''}));
const td   = () => new Date().toISOString().split('T')[0];
const esc  = s => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') : '';
const fmt  = n => n ? '₱' + parseFloat(n).toLocaleString('en-PH',{minimumFractionDigits:2}) : '₱0.00';
const initPay = () => ({
  est:'', dep:'', depMeth:'', depStaff:'', depDate:td(), depNote:'',
  final:'', payMeth:'', payStaff:'', payNote:'', payDate:'', status:'pending',
  signature:'', signedAt:'', finalSignature:'', finalSignedAt:'', noPayment:false, payFull:false
});

const pill    = (lbl,on,fn,sz=13) => `<button onclick="${fn}" style="padding:9px 18px;border-radius:24px;font-size:${sz}px;cursor:pointer;border:2.5px solid ${on?R:'#cbd5e1'};background:${on?R:'#fff'};color:${on?'#fff':'#64748b'};font-weight:${on?700:400};font-family:inherit;min-height:46px">${lbl}</button>`;
const optPill = (lbl,on,fn) => `<button onclick="${fn}" style="padding:9px 20px;border-radius:24px;font-size:14px;cursor:pointer;border:3px solid ${on?R:'#cbd5e1'};background:${on?R:'#fff'};color:${on?'#fff':'#64748b'};font-weight:${on?800:400};font-family:inherit;min-height:48px">${on?'✓ ':''}${lbl}</button>`;

// ── Storage ──────────────────────────────────────────────────────────────────
const store = {
  get: async k => { try { const v=localStorage.getItem('rbc_'+k); return v?{value:v}:null; } catch{ return null; } },
  set: async (k,v) => { try { localStorage.setItem('rbc_'+k,v); } catch{} }
};

// ── App State ─────────────────────────────────────────────────────────────────
let S = {
  scr: 'home', cx: [], url: '',
  f:  {fn:'',ln:'',p1:'',p2:'',p3:'',dt:td(),st:'',addr:'',email:'',mdl:'',col:'',plt:'',svd:td(),svs:ms(),m1:'',m2:'',m3:'',invoiceNo:'',jobOrderNo:'',prepaidNum:'',confirmedCard:'',prepaidUsedInit:0,pay:initPay()},
  vf: {svd:td(),st:'',svs:ms(),m1:'',m2:'',m3:'',useCard:false,newCardNum:'',confirmedCard:'',invoiceNo:'',jobOrderNo:'',pay:initPay()},
  ef: {fn:'',ln:'',p1:'',p2:'',p3:'',addr:'',email:'',mdl:'',col:'',plt:'',prepaidNum:'',prepaidUsed:0},
  pf: initPay(), payVidx: null, depInfo: null,
  ex:{fn:'',ln:'',p1:'',p2:'',p3:'',addr:'',email:'',mdl:'',col:'',plt:'',staff:'',svcTypes:[],svcOther:'',prepaidNum:'',prepaidUsedInit:0,confirmedCard:''},
  sel:null, selLoadErr:false, prevScr:'ret', sb:'ln', sq:'', res:[],
  lq:'', ls:'name', lStaff:'all', sheetsResults:null, sheetSearching:false,
  pw:'', pwErr:false, confirmDel:false, savedInfo:null,
  toast:null, err:'', busy:false, syncing:false
};

(async () => {
  try { const r=await store.get('cx'); if(r) S.cx=JSON.parse(r.value); } catch{}
  try { const r=await store.get('url'); if(r) S.url=r.value; } catch{}
  render();

})();

// ── Helper functions ──────────────────────────────────────────────────────────
const saveCx   = async () => { try { await store.set('cx', JSON.stringify(S.cx)); } catch{} };
const go       = s => { S.scr=s; S.err=''; S.confirmDel=false; render(); };
const flash    = (msg,t='ok') => { S.toast={msg,t}; render(); setTimeout(()=>{ S.toast=null; render(); }, 3500); };
const sf       = (k,v) => { S.f[k]=v; };
const svf      = (k,v) => { S.vf[k]=v; };
const sef      = (k,v) => { S.ef[k]=v; };
const spf      = (k,v) => { S.f.pay[k]=v; };
const svpf     = (k,v) => { S.vf.pay[k]=v; };
const ppf      = (k,v) => { S.pf[k]=v; };
const getSvcs  = svs => svs.filter(s=>s.on).map(s => { const d=SVC.find(x=>x.id===s.id); return d.n+(s.opt?' ('+s.opt+')':''); });
const crow     = (l,v) => v ? '<div class="crow"><span class="clbl">'+l+'</span><span class="cval">'+esc(v)+'</span></div>' : '';

function stepsBar(ls, cur) {
  const R = '#C41010';
  var h = '<div style="display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:18px">';
  ls.forEach((l,i) => {
    const n=i+1, dn=n<cur, ac=n===cur;
    h += '<div class="scol"><div class="sdot" style="background:'+(dn||ac?R:'#f1f5f9')+';color:'+(dn||ac?'#fff':'#94a3b8')+';border:'+(dn||ac?'none':'1px solid #e2e8f0')+'">'+(dn?'✓':n)+'</div>';
    h += '<div class="slbl" style="color:'+(ac?R:'#94a3b8')+';font-weight:'+(ac?700:400)+'">'+l+'</div></div>';
    if (i<ls.length-1) h += '<div class="sline" style="background:'+(dn?R:'#e2e8f0')+'"></div>';
  });
  return h+'</div>';
}

function cardInputSec(isV) {
  const num  = isV ? S.vf.newCardNum   : S.f.prepaidNum;
  const conf = isV ? S.vf.confirmedCard : S.f.confirmedCard;
  const ex   = isV && S.sel ? S.sel.prepaidNum : '';
  const exU  = isV && S.sel ? (S.sel.prepaidUsed||0) : 0;
  const id   = isV ? 'cinp-ret' : 'cinp-new';
  const onin = isV ? 'S.vf.newCardNum=this.value' : 'S.f.prepaidNum=this.value';
  return '<div class="card-inp-sec">'
    +'<div style="font-size:16px;font-weight:700;color:#92400e;margin-bottom:8px">🃏 Register card number</div>'
    +(ex&&exU<4 ? '<div style="background:#fef3c7;border:1.5px solid #f59e0b;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#111"><strong>⚠️ Current: #'+esc(ex)+'</strong> ('+exU+'/4). New number will replace it.</div>' : '')
    +'<div style="font-size:13px;color:#78350f;font-weight:500;margin-bottom:8px">① Enter the card number</div>'
    +'<input type="text" id="'+id+'" class="card-num-input" placeholder="e.g. 12345" value="'+esc(num)+'" oninput="'+onin+'" autocomplete="off" autocorrect="off" spellcheck="false">'
    +'<div style="font-size:13px;color:#78350f;font-weight:500;margin-bottom:8px">② Tap to confirm</div>'
    +'<button type="button" onclick="confirmCard('+isV+')" style="width:100%;padding:16px;background:'+(conf?'#15803d':'#d97706')+';color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;min-height:56px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px">'
    +(conf ? '<span>✓</span> Card registered' : '<span>🃏</span> Register card number')
    +'</button>'
    +(conf ? '<div style="margin-top:14px;padding:14px;border-radius:10px;background:#f0fdf4;border:2.5px solid #16a34a;font-size:14px;font-weight:700;color:#166534">✓ Card #'+esc(conf)+' will be linked · 4 visits · visit 4 FREE ★</div>' : '')
    +(isV?'':
      '<div style="margin-top:14px;border-top:1px solid #fde68a;padding-top:12px">'
      +'<div style="font-size:13px;font-weight:600;color:#92400e;margin-bottom:10px">③ Times already used (for existing customers)</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
      +[0,1,2,3].map(function(n){return '<button type="button" onclick="sf(\'prepaidUsedInit\','+n+');render()" style="padding:10px 18px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:2.5px solid '+(S.f.prepaidUsedInit===n?'#d97706':'#e2e8f0')+';background:'+(S.f.prepaidUsedInit===n?'#d97706':'#fff')+';color:'+(S.f.prepaidUsedInit===n?'#fff':'#64748b')+';font-family:inherit;min-height:44px">'+n+'/4'+(n===3?' ★ next FREE':'')+'</button>';}).join('')
      +'</div>'
      +'<div style="margin-top:8px;font-size:12px;color:#b45309">Select how many times this card has already been used</div>'
      +'</div>')
    +'<div style="margin-top:10px;font-size:12px;color:#b45309">4 visits · Visits 1,2,3 paid · Visit 4 FREE</div>'
    +'</div>';
}

function paySection(isV) {
  const p   = isV ? S.vf.pay : S.f.pay;
  const onin = isV ? 'svpf' : 'spf';
  const fin = parseFloat(p.est||0);
  const dep = parseFloat(p.dep||0);
  const bal = Math.max(0, fin-dep);
  return '<div class="pay-sec">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<div style="font-size:16px;font-weight:700;color:#166534">💰 Payment</div>'
    +'<button type="button" onclick="toggleNoPayment('+(isV?'true':'false')+')" class="btn-nopay'+(p.noPayment?' active':'')+'">'+(p.noPayment?'✅ No Payment':'🚫 No Payment')+'</button>'
    +'</div>'

function svcPick(svs, isV) {
  let h = '';
  const SVC_HEADERS = {
    'ppf_motec': '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#64748b;margin:6px 0 8px;padding-left:4px;border-bottom:2px solid #e2e8f0;padding-bottom:6px">🛡️ PPF</div>',
    'cer':       '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#64748b;margin:14px 0 8px;padding-left:4px;border-bottom:2px solid #e2e8f0;padding-bottom:6px">✨ Coating</div>',
    'pnt':       '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#64748b;margin:14px 0 8px;padding-left:4px;border-bottom:2px solid #e2e8f0;padding-bottom:6px">🔧 Other Services</div>',
    'prepaid':   '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#d97706;margin:14px 0 8px;padding-left:4px;border-bottom:2px solid #fde68a;padding-bottom:6px">🃏 Maintenance Prepaid Card</div>',
  };
  SVC.forEach((def,i) => {
    if (SVC_HEADERS[def.id]) h += SVC_HEADERS[def.id];
    const s  = svs[i];
    const ip = def.id==='prepaid';
    const cls = ip&&s.on ? 'svc-item on-prepaid' : 'svc-item'+(s.on?' on':'');
    h += '<div class="'+cls+'" onclick="tog('+i+','+isV+')">';
    h += '<div class="svc-row"><div class="svc-chk">'+(s.on?'<span style="color:#fff;font-size:15px;font-weight:900">✓</span>':'')+'</div>';
    h += '<span class="svc-n">'+def.n+'</span>';
    if (ip && s.on) h += '<span style="margin-left:auto;font-size:12px;color:#d97706;font-weight:600">→ Enter number below</span>';
    h += '</div>';
    if (s.on && !ip && def.opts.length) {
      h += '<div class="svc-opts" onclick="event.stopPropagation()"><span style="font-size:12px;color:#b91c1c;width:100%;display:block;margin-bottom:10px;font-weight:600">▼ Select option:</span>';
      def.opts.forEach(o => { h += optPill(o, s.opt===o, 'event.stopPropagation();setOpt('+i+',\''+o+'\','+isV+')'); });
      h += '</div>';
    }
    h += '</div>';
    if (s.on && (def.id==='ppm'||def.id==='cem'||def.id==='free_mnt')) h += maintPrompt(isV);
  });
  return h;
}

function cardDots(used) {
  const dots = ['1','2','3','★'].map((d,i) => {
    const dn = i<used;
    return '<div style="width:36px;height:36px;border-radius:50%;border:2.5px solid '+(dn?'#d97706':'#fed7aa')+';background:'+(dn?'#d97706':'#fff7ed')+';display:flex;align-items:center;justify-content:center;font-size:'+(i===3?16:14)+'px;font-weight:700;color:'+(dn?'#fff':i===3?'#d97706':'#fdba74')+'">'+(dn?'✓':d)+'</div>';
  }).join('<div style="height:2.5px;flex:1;background:#fed7aa;align-self:center;margin:0 4px"></div>');
  const rem = 4-used;
  let st='', sc='#78350f';
  if (used>=4) { st='Card complete — purchase a new card'; sc='#dc2626'; }
  else if (used===3) { st='★ NEXT VISIT IS FREE!'; sc='#d97706'; }
  else st = rem+' visit'+(rem!==1?'s':'')+' remaining — visit 4 FREE';
  return '<div style="display:flex;align-items:center;margin-bottom:10px">'+dots+'</div><div style="font-size:14px;font-weight:'+(used>=3?700:500)+';color:'+sc+'">'+st+'</div>';
}

function payBadge(pay) {
  if (!pay||!pay.est) return '';
  const colors = {pending:['#fef3c7','#92400e','⏳'],deposit:['#dbeafe','#1e40af','🏦'],completed:['#dcfce7','#166534','✅']};
  const labels = {pending:'Free','Paid Down Payment':'Paid Down Payment',deposit:'Paid Down Payment',completed:'Full Paid',paid:'Full Paid','Full Paid':'Full Paid','Free':'Free'};
  const _bal = Math.max(0, parseFloat(pay.est||0)-parseFloat(pay.dep||0));
  const _payStatus = pay.status||'pending';
  const st = (_bal===0 && parseFloat(pay.est||0)>0) ? 'Full Paid'
    : (parseFloat(pay.dep||0)>0 && _bal>0) ? 'Paid Down Payment'
    : (pay.noPayment||pay.est==='0') ? 'Free'
    : _payStatus;
  const [bg,fc,ic] = colors[st]||colors.pending;
  return '<span style="background:'+bg+';color:'+fc+';font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px">'+ic+' '+labels[st]+' '+fmt(pay.final||pay.est)+'</span>';
}

// ── Render ────────────────────────────────────────────────────────────────────
function refLabel(method) {
  if (!method) return 'Ref #';
  var m = method.toLowerCase();
  if (m.indexOf('gcash') >= 0) return 'GCash Ref #';
  if (m.indexOf('bank') >= 0) return 'Bank Ref #';
  if (m.indexOf('credit') >= 0 || m.indexOf('card') >= 0) return 'Card Ref #';
  return 'OR #';
}

// ── Signature functions ────────────────────────────────────────
function initSignature(canvasId) {
  var id = canvasId || 'sig-canvas';
  var canvas = document.getElementById(id);
  if (!canvas || canvas._initialized) return;
  canvas._initialized = true;
  canvas._id = id;
  var ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var drawing = false;

  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var touch = e.touches ? e.touches[0] : e;
    return {
      x: (touch.clientX - rect.left) * (canvas.width / rect.width),
      y: (touch.clientY - rect.top) * (canvas.height / rect.height)
    };
  }
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault(); drawing=true;
    var p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
  },{passive:false});
  canvas.addEventListener('touchmove', function(e){
    e.preventDefault(); if(!drawing)return;
    var p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke();
  },{passive:false});
  canvas.addEventListener('touchend', function(){drawing=false;});
  canvas.addEventListener('mousedown', function(e){
    drawing=true; var p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
  });
  canvas.addEventListener('mousemove', function(e){
    if(!drawing)return; var p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke();
  });
  canvas.addEventListener('mouseup', function(){drawing=false;});
  canvas.addEventListener('mouseleave', function(){drawing=false;});
}

// ── Deposit Signature functions ────────────────────────────────

async function skipDepSignature() {
  if (S.depInfo) {
    S.depInfo.signature = '';
    S.depInfo.signedAt = 'Skip signature';
  }
  // Send to Sheets without signature
  await postToSheets({
    type:'deposit',
    date: S.depInfo ? S.depInfo.date : '',
    appId: S.depInfo ? S.depInfo.appId : '',
    fn: S.depInfo ? S.depInfo.fn : '',
    ln: S.depInfo ? S.depInfo.ln : '',
    phone: S.depInfo ? S.depInfo.phone : '',
    mdl: S.depInfo ? S.depInfo.mdl : '',
    plt: S.depInfo ? S.depInfo.plt : '',
    services: S.depInfo ? S.depInfo.services : '',
    amount: S.depInfo ? S.depInfo.dep : 0,
    method: S.depInfo ? S.depInfo.depMeth : '',
    receivedBy: S.depInfo ? S.depInfo.depStaff : '',
    note: S.depInfo ? S.depInfo.depNote : '',
    balance: S.depInfo ? S.depInfo.balance : 0,
    signedAt: 'Skip signature',
    skipSignature: true,
    signatureImage: ''
  });
  flash('Down Payment recorded. Please sign on final receipt.');
  go('saved');
}
function clearDepSignature() {
  var canvas = document.getElementById('dep-sig-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

async function confirmDepSignature() {
  if (_submitting) return;
  _submitting = true;
  document.querySelectorAll('button').forEach(function(b){b.disabled=true;b.style.opacity='0.7';});
  var canvas = document.getElementById('dep-sig-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var pixels = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  var hasContent = false;
  for (var i=3; i<pixels.length; i+=4) { if(pixels[i]>0){hasContent=true;break;} }
  if (!hasContent) { alert('Please sign before confirming.'); return; }

  var sigData = canvas.toDataURL('image/png');
  var now = new Date();
  var sigText = 'Signed \u2713 ' + now.toISOString().split('T')[0] + ' ' + now.toTimeString().slice(0,5);

  if (S.depInfo) {
    S.depInfo.signature = sigData;
    S.depInfo.signedAt = sigText;
  }

  await postToSheets({
    type:'deposit',
    date: S.depInfo ? S.depInfo.date : '',
    appId: S.depInfo ? S.depInfo.appId : '',
    fn: S.depInfo ? S.depInfo.fn : '',
    ln: S.depInfo ? S.depInfo.ln : '',
    phone: S.depInfo ? S.depInfo.phone : '',
    mdl: S.depInfo ? S.depInfo.mdl : '',
    plt: S.depInfo ? S.depInfo.plt : '',
    services: S.depInfo ? S.depInfo.services : '',
    amount: S.depInfo ? S.depInfo.dep : 0,
    method: S.depInfo ? S.depInfo.depMeth : '',
    receivedBy: S.depInfo ? S.depInfo.depStaff : '',
    note: S.depInfo ? S.depInfo.depNote : '',
    balance: S.depInfo ? S.depInfo.balance : 0,
    signedAt: sigText,
    signatureImage: sigData
  });

  _submitting = false;
  flash('Down Payment receipt signed! \u2713');
  render();
}

function confirmExCard() {
  var el = document.getElementById('cinp-ex');
  var val = (el?el.value:'').trim();
  if (!val) { alert('Please enter a card number first.'); return; }
  S.ex.prepaidNum = val;
  S.ex.confirmedCard = val;

}

async function submitExisting() {
  if (_submitting) return;
  _submitting = true; S.busy=true; render();
  var ex = S.ex;
  if (!ex.fn.trim()||!ex.ln.trim()) { S.err='First and last name required.'; _submitting=false; S.busy=false; render(); return; }
  if (!ex.p1||!ex.p2||!ex.p3)      { S.err='Phone number required.'; _submitting=false; S.busy=false; render(); return; }
  if (!ex.staff)                    { S.err='Please select staff.'; _submitting=false; S.busy=false; render(); return; }
  if (!ex.mdl.trim())               { S.err='Vehicle model is required.'; _submitting=false; S.busy=false; render(); return; }
  // Color: read from DOM if not set
  var colEl = document.querySelector('select[onchange*="S.ex.col"]');
  if (colEl && colEl.value) S.ex.col = colEl.value;
  var colInp = document.querySelector('input[placeholder*="color"], input[placeholder*="Color"]');

function clearSignature() {
  var canvas = document.getElementById('sig-canvas');

}

async function confirmSignature() {
  if (_submitting) return;
  _submitting = true;
  document.querySelectorAll('button').forEach(function(b){b.disabled=true;b.style.opacity='0.7';});
  var canvas = document.getElementById('sig-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var pixels = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  var hasContent = false;
  for (var i=3; i<pixels.length; i+=4) { if(pixels[i]>0){hasContent=true;break;} }
  if (!hasContent) { alert('Please sign before confirming.'); return; }

  var sigData = canvas.toDataURL('image/png');
  var now = new Date();
  var sigText = 'Signed \u2713 ' + now.toISOString().split('T')[0] + ' ' + now.toTimeString().slice(0,5);

  var c = S.sel; if(!c) return;
  var vidx = S.payVidx!=null ? S.payVidx : (c.visits||[]).length-1;

  S.cx = S.cx.map(function(cx){
    if(cx.id!==c.id) return cx;
    return Object.assign({},cx,{visits:cx.visits.map(function(v,i){
      if(i!==vidx) return v;
      return Object.assign({},v,{pay:Object.assign({},v.pay,{finalSignature:sigData,finalSignedAt:sigText})});
    })});
  });
  S.sel = S.cx.find(function(x){return x.id===c.id;});
  await saveCx();
  await silentPush(); // 自動バックアップ

  await postToSheets({
    type:'signature',
    id:c.id,
    fn:c.fn||'', ln:c.ln||'',
    visitDate:(c.visits||[])[vidx]?c.visits[vidx].date:'',
    signedAt:sigText,
    signatureImage:sigData
  });

  _submitting = false;
  flash('Signature saved! \u2713');
  render();
}

function fmtVisitDate(d) {
  if (!d) return '';
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // ISO format "2026-07-31"
  if (/^\d{4}-\d{2}-\d{2}/.test(d)) {
    var parts = d.split('-');
    return months[parseInt(parts[1])-1] + ' ' + parseInt(parts[2]) + ', ' + parts[0];
  }
  // "2026/07/31"
  if (/^\d{4}\/\d{2}\/\d{2}/.test(d)) {
    var p2 = d.split('/');
    return months[parseInt(p2[1])-1] + ' ' + parseInt(p2[2]) + ', ' + p2[0];
  }
  // "Fri Jul 28 2026 ..." or similar with year
  var dt = new Date(d);
  if (!isNaN(dt.getTime()) && dt.getFullYear() > 2000) {
    return months[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear();
  }
  return d; // unknown format, show as-is
}

async function fetchCxFromSheets(q, by) {
  if (!S.url) return null;
  try {
    var url = S.url + '?action=search&q=' + encodeURIComponent(q||'') + '&by=' + encodeURIComponent(by||'ln');
    var ctrl2 = new AbortController();
    var timer2 = setTimeout(function(){ ctrl2.abort(); }, 10000); // 10秒タイムアウト
    var r = await fetch(url, {signal: ctrl2.signal});
    clearTimeout(timer2);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var text = await r.text();
    var d;
    try { d = JSON.parse(text); } catch(pe) { throw new Error('Invalid JSON: ' + text.slice(0,100)); }
    if (d.ok === false && d.error) {
      flash('GS Error: ' + d.error, 'err');
      return null;
    }
    if (!Array.isArray(d.customers) && d.ok === true && !d.count) {
      flash('⚠️ Apps Script not updated. Please redeploy with NEW VERSION.', 'err');
      return null;
    }
    return d.customers || []; // 本当に0件ならここで空配列
  } catch(e) {
    flash('Connection error: ' + e.message, 'err');
    return null; // 通信失敗はnull（0件とは区別する）
  }
}

async function fetchOneCxFromSheets(appId, _isRetry) {
  if (!S.url) return null;
  try {
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 15000); // 15秒タイムアウト
    var r = await fetch(S.url+'?action=getCx&appId='+encodeURIComponent(appId),
      {signal: ctrl.signal});
    clearTimeout(timer);
    var d = await r.json();
    return d.customer || null;
  } catch(e) {
    if (!_isRetry) return fetchOneCxFromSheets(appId, true); // 1回だけ自動リトライ
    return null;
  }
}

async function saveEditVisit() {
  const c = S.sel; if (!c) return;
  const vi = parseInt(S.editVidx);
  const v = (c.visits||[])[vi]; if (!v) return;
  if (vi !== (c.visits||[]).length-1) {
    flash('Only the most recent service history can be edited.', 'err');
    go('prof');
    return;
  }
  const inv = document.getElementById('ev-inv');
  const job = document.getElementById('ev-job');
  const est = document.getElementById('ev-est');
  if (!inv||!inv.value.trim()) { S.err='Invoice No. is required.'; render(); return; }
  if (!job||!job.value.trim()) { S.err='Job Order No. is required.'; render(); return; }
  if (!S.evStaff || S.evStaff==='__other__') { S.err='Please select who is making this edit.'; render(); return; }

  const newSvcs = _editSvcs.filter(Boolean);
  const newEst  = (est && est.value.trim()) ? est.value.trim() : (v.pay.est||'');
  const editedBy = S.evStaff;

  // ── Amendment: 元の記録はそのまま保存 ──────────────────────

  const changed =
    inv.value.trim() !== (v.invoiceNo||'') ||
    job.value.trim() !== (v.jobOrderNo||'') ||
    newSvcs.join(',') !== (v.svcs||[]).join(',') ||
    newEst !== (v.pay.est||'');

  if (!changed) { go('prof'); return; }

  // 元の記録にamendment参照を追加
  v.hasAmendment = true;

  // 新しいamendmentレコードを作成（元の隣に追加）

    date:       v.date,
    staff:      v.staff,
    editedBy:   editedBy,
    invoiceNo:  inv.value.trim(),
    jobOrderNo: job.value.trim(),
    svcs:       newSvcs,
    memo:       v.memo||'',
    usedCard:   v.usedCard,
    visitType:  'Amendment',
    amendedAt:  new Date().toISOString().slice(0,10),
    originalIdx: vi,
    pay: Object.assign({}, v.pay, {est: newEst})
  };

  // visitsにamendmentを挿入（元の直後）
  c.visits.splice(vi+1, 0, amendment);

  _editSvcs = [];
  _editSvcsInited = false;
  S.err = '';

  // ローカルキャッシュ更新
  const ci = S.cx.findIndex(function(cx){ return cx.id===c.id; });
  if (ci>=0) S.cx[ci] = c;
  await saveCx();

  // Sheetsに追記（上書きではなく新規行として）
  if (S.url) {
    try {
      await postToSheets({
        type: 'amendment',
        id:   c.id,
        originalInvoiceNo:  v.invoiceNo||'',
        originalJobOrderNo: v.jobOrderNo||'',
        originalServices:   (v.svcs||[]).join(', '),
        originalEstimate:   v.pay.est||'',
        newInvoiceNo:   amendment.invoiceNo,
        newJobOrderNo:  amendment.jobOrderNo,
        newServices:    amendment.svcs.join(', '),
        newEstimate:    newEst,
        amendedAt:      amendment.amendedAt,
        editedBy:       editedBy,
        fn: c.fn, ln: c.ln, date: v.date
      });
    } catch(e) {}
  }

  flash('✅ Amendment saved. Original record preserved.');
  go('prof');
}
function localSearch(q, sb) {
  if (!q) return [...S.cx];
  const ql = (q||'').toLowerCase().trim();
  const mode = sb||'ln';
  return S.cx.filter(function(c) {
    if (mode==='p4') {
      var digits = ql.replace(/[^0-9]/g,'');
      var last4  = (c.phone||'').replace(/[^0-9]/g,'').slice(-4);
      return digits && last4.includes(digits);
    }
    if (mode==='em') return (c.email||'').toLowerCase().includes(ql);
    if (mode==='pl') return (c.plt||'').toLowerCase().includes(ql);
    // 'ln'（名前）: 姓・名・フルネームのみを対象にする（電話番号や車種等は含めない）
    var haystack = [
      c.fn||'', c.ln||'', (c.fn||'')+' '+(c.ln||''), (c.ln||'')+' '+(c.fn||'')
    ].join(' ').toLowerCase();
    return haystack.includes(ql);
  });
}

let _searchSeq = 0;
async function doSearch() {
  const q = (S.sq||'').trim();
  const sb = S.sb||'ln';
  const seq = ++_searchSeq; // このリクエスト固有の連番
  if (!q) { S.res=[]; render(); return; }

  // まずローカルから即時表示（選択中のタブで絞り込み）
  S.res = localSearch(q, sb);
  render();

  // Sheetsからも検索
  if (S.url) {
    S.busy = false;
    try {
      var results = await fetchCxFromSheets(q, sb);
      if (seq !== _searchSeq) return; // 後から別の検索が始まっていたら、この古い結果は破棄
      if (results !== null) {
        // バックエンドから正常に応答があった場合は、その結果を正として採用する
        // （0件なら0件として表示。通信失敗時(null)はローカル検索結果を残す）
        S.res = results;
        results.forEach(function(sc) {
          var i = S.cx.findIndex(function(lc){ return lc.id===sc.id||lc.cxId===sc.cxId; });
          if (i>=0) S.cx[i]=Object.assign(S.cx[i],sc); else S.cx.push(sc);
        });
      }
    } catch(e) {}
    if (seq === _searchSeq) render();
  }
}

let _openSeq = 0;
async function openCx(id, from) {
  S.prevScr = from||'ret';
  S.confirmDel = false;
  // キャッシュとres両方から検索
  var cx = S.cx.find(function(c){ return c.id===id||c.cxId===id; });
  if (!cx && S.res) cx = S.res.find(function(c){ return c.id===id||c.cxId===id; });
  if (!cx) { flash('Customer not found','err'); return; }
  S.sel = cx;
  S.selLoadErr = false;
  const seq = ++_openSeq; // この顧客オープン処理固有の連番
  go('prof');
  // バックグラウンドでvisitsを取得
  if (S.url) {
    try {
      var full = await fetchOneCxFromSheets(id);
      if (seq !== _openSeq) return; // 後から別の顧客が開かれていたら、この古い結果は破棄
      if (full) {
        if ((!full.visits||full.visits.length===0)&&(cx.visits||[]).length>0) full.visits=cx.visits;
        S.sel = full;
        S.selLoadErr = false;
        var ci = S.cx.findIndex(function(c){ return c.id===full.id||c.cxId===full.cxId; });
        if (ci>=0) S.cx[ci]=full; else S.cx.push(full);
        if (S.scr==='prof') render();
      } else {
        S.selLoadErr = true;
        if (S.scr==='prof') render();
      }
    } catch(e) {
      if (seq !== _openSeq) return;
      S.selLoadErr = true;
      if (S.scr==='prof') render();
    }
  }
}

  el.style.background = '#94a3b8';
  el.style.pointerEvents = 'none';
  el.textContent = '⏳ Processing...';
  var result = fn();
  // async functionの場合、エラー時にボタンを復元
  if (result && typeof result.then === 'function') {
    result.catch(function(e) {
      el.style.background = origBg;
      el.style.pointerEvents = '';
      el.textContent = origText;
      console.error('Submit error:', e);
    });
  }
}

const APP_PW = 'rebirth';

// ── Sheetsへの汎用送信 ───────────────────────────────────────────
async function postToSheets(payload) {
  if (!S.url) return {ok:false, error:'No Apps Script URL set'};
  try {
    var res = await fetch(S.url, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    var text = await res.text();
    try { return JSON.parse(text); } catch(pe) { return {ok:true}; }
  } catch(e) {
    console.log('postToSheets error:', e);
    return {ok:false, error:e.message};
  }
}

// ── バックグラウンド自動バックアップ（軽量ping） ───────────────────
async function silentPush() {
  if (!S.url) return;
  try { await postToSheets({type:'push_all'}); } catch(e) {}
}

// ── 設定画面：手動Push/Pull ────────────────────────────────────
async function pushToSheets() {
  if (!S.url) { flash('Please enter and save the Apps Script URL first.', 'err'); return; }
  S.syncing = true; render();
  try {
    await postToSheets({type:'push_all'});
    flash('✅ Pushed to Sheets.');
  } catch(e) {
    flash('Push failed: '+e.message, 'err');
  }
  S.syncing = false; render();
}

async function pullFromSheets() {
  if (!S.url) { flash('Please enter and save the Apps Script URL first.', 'err'); return; }
  S.syncing = true; render();
  try {
    var r = await fetch(S.url+'?action=get');
    var d = await r.json();
    if (d.ok && Array.isArray(d.customers)) {
      d.customers.forEach(function(sc) {
        var i = S.cx.findIndex(function(lc){ return lc.id===sc.id||lc.cxId===sc.cxId; });
        if (i>=0) S.cx[i]=Object.assign({},S.cx[i],sc); else S.cx.push(sc);
      });
      await saveCx();
      flash('✅ Pulled '+d.customers.length+' customer(s) from Sheets.');
    } else {
      flash('Pull failed: '+(d.error||'unknown error'), 'err');
    }
  } catch(e) {
    flash('Pull failed: '+e.message, 'err');
  }
  S.syncing = false; render();
}

async function saveUrl() {
  try { await store.set('url', S.url||''); } catch(e) {}
  flash('Apps Script URL saved.');
  render();
}

// ── サービス選択トグル ─────────────────────────────────────────
function tog(i, isV) {
  var svs = isV ? S.vf.svs : S.f.svs;
  svs[i].on = !svs[i].on;
  if (svs[i].on) {
    var def = SVC[i];

}

function val3() {
  var f = S.f;

  if (!svcs.length) { S.err='Please select at least one service.'; render(); return; }

// ── 新規顧客登録の送信 ───────────────────────────────────────────
async function submitNew() {
  if (_submitting) return;
  _submitting = true; S.busy = true; render();

  var f = S.f;
  var svcs = getSvcs(f.svs);
  var id = 'A'+Date.now();
  var phone = f.p1+'-'+f.p2+'-'+f.p3;
  var pOn = f.svs[SVC.findIndex(x=>x.id==='prepaid')]?.on;
  var cardNum = pOn ? (f.confirmedCard||'') : '';
  var est = f.pay.noPayment ? 0 : parseFloat(f.pay.est||0);
  var dep = parseFloat(f.pay.dep||0);

  var rec = {
    id: id, fn:f.fn, ln:f.ln, p1:f.p1, p2:f.p2, p3:f.p3, phone:phone,
    email:f.email||'', addr:f.addr||'',
    firstVisit: f.dt, staff:f.st||'',
    mdl:f.mdl||'', col:f.col||'', plt:f.plt||'',
    prepaidNum: cardNum, prepaidUsed: cardNum ? (parseInt(f.prepaidUsedInit)||0) : 0,
    visits: [{
      date: f.svd, staff: f.st||'', svcs: svcs,
      memo: [f.m1,f.m2,f.m3].filter(Boolean).join(' / '),
      usedCard:false, prepaidVisitNum:null,
      invoiceNo: f.invoiceNo||'', jobOrderNo: f.jobOrderNo||'',
      pay: {
        est:String(est||''), dep:String(dep||''), depMeth:f.pay.depMeth||'',
        status: f.pay.noPayment ? 'Free' : (dep>0 ? 'deposit' : 'pending'),
        final:String(est||''), signedAt:'', signature:''
      }
    }]
  };

  S.cx.push(rec);
  await saveCx();

  var newCxId = '';
  try {
    var result = await postToSheets({
      type:'new', id:id,
      fn:f.fn, ln:f.ln, phone:phone, email:f.email||'', addr:f.addr||'',
      firstVisit:f.dt, date:f.svd, staff:f.st||'',
      mdl:f.mdl||'', col:f.col||'', plt:f.plt||'',
      prepaidNum:cardNum, prepaidUsed: cardNum?(parseInt(f.prepaidUsedInit)||0):0,
      services: svcs.join(', '),
      estimate: est, deposit: dep,
      depositMethod: f.pay.depMeth||'', depositStaff: f.pay.depStaff||'', depositNote: f.pay.depNote||'',
      memo: [f.m1,f.m2,f.m3].filter(Boolean).join(' / '),
      invoiceNo: f.invoiceNo||'', jobOrderNo: f.jobOrderNo||''
    });
    if (result && result.cxId) {
      newCxId = result.cxId;
      var newCi = S.cx.findIndex(function(x){return x.id===id;});
      if (newCi>=0) S.cx[newCi].cxId = newCxId;
      await saveCx();
    }
  } catch(e) { console.log('Sheets error:', e); }

  S.savedInfo = {type:'new', name:f.fn+' '+f.ln, date:f.svd, staff:f.st, svcs:svcs, card:cardNum, selId:id};

  _submitting = false; S.busy = false;

  if (dep > 0 && f.pay.depMeth) {
    S.depInfo = {
      date: f.svd, appId: id, cxId: newCxId, fn:f.fn, ln:f.ln, phone:phone, mdl:f.mdl||'', plt:f.plt||'',
      invoiceNo: f.invoiceNo||'', jobOrderNo: f.jobOrderNo||'',
      services: svcs.join(', '), est: est, dep: dep, depMeth: f.pay.depMeth, depStaff: f.pay.depStaff||'',
      depNote: f.pay.depNote||'', balance: Math.max(0, est-dep),
      signedAt:'', signature:'', isFullPayment: (dep >= est && est>0)
    };
    go('depReceipt');
  } else {
    go('saved');
  }
}

// ── 再来店visitの送信 ────────────────────────────────────────────
async function submitVisit() {
  if (_submitting) return;
  _submitting = true; S.busy = true; render();

  var c = S.sel;
  if (!c) { _submitting=false; S.busy=false; render(); return; }

  var f = S.vf;
  var svcs = getSvcs(f.svs);
  var pOn = f.svs[SVC.findIndex(x=>x.id==='prepaid')]?.on;
  var newCard = pOn ? (f.newCardNum||'') : '';
  var useExistingCard = !!(c.prepaidNum && (c.prepaidUsed||0) < 4 && !newCard);
  var prepaidVisitNum = useExistingCard ? (c.prepaidUsed||0)+1 : null;
  var est = f.pay.noPayment ? 0 : parseFloat(f.pay.est||0);
  var dep = parseFloat(f.pay.dep||0);

  var visit = {
    date: f.svd, staff: f.st||'', svcs: svcs,
    memo: [f.m1,f.m2,f.m3].filter(Boolean).join(' / '),
    usedCard: useExistingCard, prepaidVisitNum: prepaidVisitNum,
    invoiceNo: f.invoiceNo||'', jobOrderNo: f.jobOrderNo||'',
    pay: {
      est:String(est||''), dep:String(dep||''), depMeth:f.pay.depMeth||'',
      status: f.pay.noPayment ? 'Free' : (dep>0 ? 'deposit' : 'pending'),
      final:String(est||''), signedAt:'', signature:''
    }
  };

  var ci = S.cx.findIndex(function(x){return x.id===c.id;});
  if (ci>=0) {
    S.cx[ci].visits = (S.cx[ci].visits||[]).concat([visit]);
    if (newCard) { S.cx[ci].prepaidNum = newCard; S.cx[ci].prepaidUsed = 0; }
    else if (useExistingCard) { S.cx[ci].prepaidUsed = prepaidVisitNum; }
    S.sel = S.cx[ci];
  }
  await saveCx();

  var newCxId = c.cxId || '';
  try {
    var result = await postToSheets({
      type:'return', id:c.id,
      fn:c.fn, ln:c.ln, phone:c.phone||'', mdl:c.mdl||'', plt:c.plt||'',
      visitDate: f.svd, date: f.svd, staff: f.st||'',
      services: svcs.join(', '),
      estimate: est, deposit: dep,
      depositMethod: f.pay.depMeth||'', depositStaff: f.pay.depStaff||'', depositNote: f.pay.depNote||'',
      memo: [f.m1,f.m2,f.m3].filter(Boolean).join(' / '),
      invoiceNo: f.invoiceNo||'', jobOrderNo: f.jobOrderNo||'',
      prepaidNum: newCard||c.prepaidNum||'',
      prepaidVisitNum: prepaidVisitNum
    });
    if (result && result.cxId) {
      newCxId = result.cxId;
      if (ci>=0) { S.cx[ci].cxId = newCxId; S.sel = S.cx[ci]; }
      await saveCx();
    }
  } catch(e) { console.log('Sheets error:', e); }

  S.savedInfo = {type:'return', name:c.fn+' '+c.ln, date:f.svd, staff:f.st, svcs:svcs,
    card:newCard, useCard:useExistingCard, prepaidVisitNum:prepaidVisitNum, selId:c.id};

  _submitting = false; S.busy = false;

  if (dep > 0 && f.pay.depMeth) {
    S.depInfo = {
      date: f.svd, appId: c.id, cxId: newCxId, fn:c.fn, ln:c.ln, phone:c.phone||'', mdl:c.mdl||'', plt:c.plt||'',
      invoiceNo: f.invoiceNo||'', jobOrderNo: f.jobOrderNo||'',
      services: svcs.join(', '), est: est, dep: dep, depMeth: f.pay.depMeth, depStaff: f.pay.depStaff||'',
      depNote: f.pay.depNote||'', balance: Math.max(0, est-dep),
      signedAt:'', signature:'', isFullPayment: (dep >= est && est>0)
    };
    go('depReceipt');
  } else {
    go('saved');
  }
}

// ── 支払い完了（Mark as PAID） ───────────────────────────────────
async function completePayment() {
  var c = S.sel; if (!c) return;
  var vidx = S.payVidx;
  var vs = c.visits||[];
  var v = vs[vidx]; if (!v) return;
  var pf = S.pf;
  var p = v.pay||{};
  var dep = parseFloat(p.dep||0);
  var fin = parseFloat(pf.final||p.est||0);
  var remain = Math.max(0, fin-dep);

  if (remain > 0) {
    if (!pf.payMeth)  { S.err='Please select a payment method.'; render(); return; }
    if (!pf.payStaff) { S.err='Please select who received the payment.'; render(); return; }
    if (!pf.payNote)  { S.err='Please enter the reference number.'; render(); return; }
  }

  var now = new Date();
  v.pay = Object.assign({}, v.pay, {
    final: String(fin), status:'completed',
    payMeth: pf.payMeth||'', payStaff: pf.payStaff||'', payNote: pf.payNote||'',
    payDate: now.toISOString().split('T')[0]
  });

  var ci = S.cx.findIndex(function(x){return x.id===c.id;});
  if (ci>=0) { S.cx[ci].visits[vidx] = v; S.sel = S.cx[ci]; }
  await saveCx();

  try {
    await postToSheets({
      type:'payment', id:c.id,
      fn:c.fn, ln:c.ln,
      visitDate: v.date, paymentDate: v.pay.payDate,
      finalAmount: fin, deposit: dep,
      paymentMethod: pf.payMeth||'', paymentStaff: pf.payStaff||'', paymentNote: pf.payNote||''
    });
  } catch(e) { console.log('Sheets error:', e); }

  S.err = '';
  flash('✅ Payment recorded!');
  go('receipt');
}

// ── 顧客情報の編集 ────────────────────────────────────────────
function initEdit() {
  var c = S.sel; if (!c) return;
  S.ef = {
    fn:c.fn||'', ln:c.ln||'',
    p1:c.p1||(c.phone?c.phone.split('-')[0]:''),
    p2:c.p2||(c.phone?c.phone.split('-')[1]:''),

    mdl:c.mdl||'', col:c.col||'', plt:c.plt||'',
    prepaidNum:c.prepaidNum||'', prepaidUsed:c.prepaidUsed||0
  };
  S.err = '';
  go('edit');
}

async function submitEdit() {
  var c = S.sel; if (!c) return;
  var ef = S.ef;
  if (!ef.fn.trim()||!ef.ln.trim()) { S.err='First and last name are required.'; render(); return; }
  if (!ef.p1||!ef.p2||!ef.p3)       { S.err='Phone number is required.'; render(); return; }
  if (!(ef.col||'').trim())          { S.err='Vehicle color is required.'; render(); return; }
  if (!ef.plt.trim())                { S.err='License plate is required.'; render(); return; }

  var phone = ef.p1+'-'+ef.p2+'-'+ef.p3;

    S.cx[ci] = Object.assign({}, S.cx[ci], {
      fn:ef.fn, ln:ef.ln, p1:ef.p1, p2:ef.p2, p3:ef.p3, phone:phone,
      addr:ef.addr, email:ef.email, mdl:ef.mdl, col:ef.col, plt:ef.plt,
      prepaidNum:ef.prepaidNum, prepaidUsed:ef.prepaidUsed
    });

    await postToSheets({
      type:'editCustomer', id:c.id,
      fn:ef.fn, ln:ef.ln, phone:phone, addr:ef.addr||'', email:ef.email||'',
      mdl:ef.mdl||'', col:ef.col||'', plt:ef.plt||'',
      prepaidNum:ef.prepaidNum||'', prepaidUsed:ef.prepaidUsed||0
    });
  } catch(e) { console.log('Sheets error:', e); }

  S.err = '';
  flash('✅ Customer info updated.');
  go('prof');
}

// ── 顧客の削除 ───────────────────────────────────────────────────
async function deleteCustomer() {
  var c = S.sel; if (!c) return;
  S.busy = true; render();
  try {
    var result = await postToSheets({type:'delete', id:c.id});
    if (result && result.ok === false) {
      S.busy = false;
      flash('Delete failed: '+(result.error||'unknown error'), 'err');
      render();
      return;
    }
    S.cx = S.cx.filter(function(x){ return x.id!==c.id; });
    S.res = (S.res||[]).filter(function(x){ return x.id!==c.id; });
    await saveCx();
    S.confirmDel = false;
    S.sel = null;
    S.busy = false;
    flash('🗑️ Customer deleted.');
    go('ret');
  } catch(e) {
    S.busy = false;
    flash('Delete failed: '+e.message, 'err');
    render();
  }
}

function render() {
  const b = document.getElementById('body');
  if (!b) return;
  let h = '';
  if (S.toast) h += '<div class="tb tb-'+S.toast.t+'">'+(S.toast.t==='ok'?'✓ ':S.toast.t==='err'?'✕ ':'')+S.toast.msg+'</div>';
  const m = {
    home:homeScr, pwList:pwListScr, ret:retScr,
    prof:profScr, edit:editScr,
    new1:new1Scr, new2:new2Scr, new3:new3Scr, newConf:newConfScr,
    retVisit:retVisitScr, retConf:retConfScr,
    saved:savedScr, settings:settingsScr,
    pay:payScr, receipt:receiptScr, pwSettings:pwSettingsScr, depReceipt:depReceiptScr, existing:existingScr, editVisit:editVisitScr
  };
  h += (m[S.scr]||homeScr)();
  b.innerHTML = h;
  if (S.scr === 'receipt') { setTimeout(function(){initSignature('sig-canvas');}, 50); }
    if (S.scr === 'depReceipt') { setTimeout(function(){initSignature('dep-sig-canvas');}, 50); }
}
